<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>抖音广告自动跳过</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="mark">跳</span>
      <div><h1>抖音广告跳过</h1><p>整条广告 + 社区片段</p></div>
    </header>

    <label class="setting primary">
      <span><strong>自动跳过</strong><small>整条广告、草稿与社区片段</small></span>
      <input id="enabled" type="checkbox"><i></i>
    </label>
    <label class="setting">
      <span><strong>显示跳过提示</strong></span>
      <input id="showToast" type="checkbox"><i></i>
    </label>
    <label class="setting">
      <span><strong>调试日志</strong><small>输出到网页控制台</small></span>
      <input id="debug" type="checkbox"><i></i>
    </label>

    <section class="stats-grid">
      <div><strong id="count">0</strong><span>累计跳过</span></div>
      <div><strong id="segmentCount">0</strong><span>本地草稿</span></div>
    </section>
    <section class="quick-actions">
      <button id="openSegments"><span>≡</span>片段管理</button>
      <button id="openOptions"><span>⚙</span>完整设置</button>
    </section>
    <p class="note">默认连接公共社区 API，只查询当前作品，不上传完整浏览记录。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
