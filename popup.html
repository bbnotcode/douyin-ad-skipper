<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>抖音网页版社区片段助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="mark">跳</span>
      <div><h1>抖音网页版社区片段助手</h1><p id="communitySummary">仅本地模式</p></div>
    </header>

    <label class="setting primary">
      <span><strong>时间片段助手</strong><small>播放器标记、预览与片段跳过</small></span>
      <input id="enabled" type="checkbox"><i></i>
    </label>
    <label class="setting">
      <span><strong>显示跳过提示</strong><small>必要操作和错误仍会显示</small></span>
      <input id="showToast" type="checkbox"><i></i>
    </label>
    <label class="setting">
      <span><strong>调试日志</strong><small>输出到网页控制台</small></span>
      <input id="debug" type="checkbox"><i></i>
    </label>

    <section class="stats-grid">
      <div><strong id="count">0</strong><span>累计跳过</span></div>
      <div><strong id="segmentCount">0</strong><span>本地草稿</span></div>
    </section>
    <section class="quick-actions">
      <button id="openSegments"><span>≡</span>片段管理</button>
      <button id="openOptions"><span>⚙</span>完整设置</button>
    </section>
    <section id="consentNotice" class="consent-notice" hidden>
      <strong>社区功能尚未启用</strong>
      <p>明确同意后，扩展才会发送当前作品 ID 的哈希值来查询社区片段。</p>
      <button id="reviewConsent">查看并选择</button>
    </section>
    <p class="note">本地草稿不会自动上传。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
