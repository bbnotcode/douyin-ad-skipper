name: Package release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Verify tag and extension
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --check content.js
          node --check player-adapter.js
          node --check popup.js
          node --check options.js
          node scripts/validate-extension.mjs
          node scripts/test-extension-logic.mjs
          node scripts/test-player-adapter.mjs
          node -e "const v=require('./manifest.json').version;if(process.env.GITHUB_REF_NAME!=='v'+v)throw new Error('Tag 与 manifest 版本不一致')"
      - name: Test Worker
        working-directory: server
        run: npm ci && npm test && npm run check
      - name: Build Chrome ZIP
        run: |
          mkdir -p dist/douyin-ad-skipper
          cp manifest.json player-adapter.js content.js content.css popup.html popup.js popup.css options.html options.js options.css LICENSE PRIVACY.md SECURITY.md dist/douyin-ad-skipper/
          mkdir -p dist/douyin-ad-skipper/icons
          cp icons/icon-16.png icons/icon-32.png icons/icon-48.png icons/icon-128.png dist/douyin-ad-skipper/icons/
          cd dist/douyin-ad-skipper
          zip -r ../douyin-ad-skipper-${GITHUB_REF_NAME}.zip .
      - name: Validate package and create checksum
        run: |
          node scripts/validate-package.mjs dist/douyin-ad-skipper
          shasum -a 256 "dist/douyin-ad-skipper-${GITHUB_REF_NAME}.zip" > "dist/douyin-ad-skipper-${GITHUB_REF_NAME}.zip.sha256"
          node scripts/extract-release-notes.mjs "$GITHUB_REF_NAME" dist/release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/douyin-ad-skipper-${GITHUB_REF_NAME}.zip" "dist/douyin-ad-skipper-${GITHUB_REF_NAME}.zip.sha256" --notes-file dist/release-notes.md --verify-tag
